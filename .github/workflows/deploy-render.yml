name: Render Deployment

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      deploy_web:
        required: true
        type: boolean
      deploy_backend:
        required: true
        type: boolean
      deploy_chat:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      sha:
        description: GHCR image tag / Git commit SHA to deploy
        required: true
        type: string
      deploy_web:
        description: Deploy web
        required: true
        default: true
        type: boolean
      deploy_backend:
        description: Deploy backend
        required: true
        default: true
        type: boolean
      deploy_chat:
        description: Deploy all configured chat services
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Normalize GHCR owner
        id: owner
        shell: bash
        run: echo "value=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy web
        if: inputs.deploy_web
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/eventseasy-web:${{ inputs.sha }}
        run: curl --fail --silent --show-error --get "$HOOK" --data-urlencode "imgURL=$IMAGE"

      - name: Deploy backend
        if: inputs.deploy_backend
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/eventseasy-backend:${{ inputs.sha }}
        run: curl --fail --silent --show-error --get "$HOOK" --data-urlencode "imgURL=$IMAGE"

      - name: Deploy chat service 1
        if: inputs.deploy_chat
        env:
          HOOK: ${{ secrets.RENDER_CHAT_1_DEPLOY_HOOK }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/eventseasy-chat:${{ inputs.sha }}
        run: |
          if [ -n "$HOOK" ]; then
            curl --fail --silent --show-error --get "$HOOK" --data-urlencode "imgURL=$IMAGE"
          fi

      - name: Deploy chat service 2
        if: inputs.deploy_chat
        env:
          HOOK: ${{ secrets.RENDER_CHAT_2_DEPLOY_HOOK }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/eventseasy-chat:${{ inputs.sha }}
        run: |
          if [ -n "$HOOK" ]; then
            curl --fail --silent --show-error --get "$HOOK" --data-urlencode "imgURL=$IMAGE"
          fi

      - name: Deploy chat service 3
        if: inputs.deploy_chat
        env:
          HOOK: ${{ secrets.RENDER_CHAT_3_DEPLOY_HOOK }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/eventseasy-chat:${{ inputs.sha }}
        run: |
          if [ -n "$HOOK" ]; then
            curl --fail --silent --show-error --get "$HOOK" --data-urlencode "imgURL=$IMAGE"
          fi
