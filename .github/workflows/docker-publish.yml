name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/**"
      - "chat/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/deploy-render.yml"

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      chat: ${{ steps.filter.outputs.chat }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/docker-publish.yml'

            backend:
              - 'backend/**'
              - '.github/workflows/docker-publish.yml'

            chat:
              - 'chat/**'
              - '.github/workflows/docker-publish.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            INTERNAL_API_URL=${{ vars.INTERNAL_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventseasy-web:main
            ghcr.io/${{ github.repository_owner }}/eventseasy-web:${{ github.sha }}

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventseasy-backend:main
            ghcr.io/${{ github.repository_owner }}/eventseasy-backend:${{ github.sha }}

  chat:
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./chat
          file: ./chat/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventseasy-chat:main
            ghcr.io/${{ github.repository_owner }}/eventseasy-chat:${{ github.sha }}

  deploy:
    needs: [changes, web, backend, chat]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.chat.result == 'success' || needs.chat.result == 'skipped') &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.chat == 'true')
    uses: ./.github/workflows/deploy-render.yml
    with:
      sha: ${{ github.sha }}
      deploy_web: ${{ needs.changes.outputs.web == 'true' }}
      deploy_backend: ${{ needs.changes.outputs.backend == 'true' }}
      deploy_chat: ${{ needs.changes.outputs.chat == 'true' }}
    secrets: inherit
