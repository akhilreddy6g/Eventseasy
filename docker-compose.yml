services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "4000:4000"
    env_file:
      - .env.docker
    environment:
      PORT: 4000
      NODE_ENV: development
      ENV: development
      CLIENT_URL: http://localhost:3001
      MONGO_URI: mongodb://mongo:27017/test
      REDIS_URL: redis://redis:6379
      KAFKA_CLIENT_URL: kafka:19092
    depends_on:
      - mongo
      - redis
      - kafka

  web:
    build:
      context: ./web
      target: development
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
      NODE_ENV: development
    depends_on:
      - backend

  chat-backend:
    build:
      context: ./chat
    container_name: eventseasy-chat-backend-1
    environment:
      PORT: 8080
      SERVER_CLIENT_ID: chat-server-1
      NODE_ENV: development

      MONGO_URI: mongodb://mongo:27017/test

      KAFKA_CLIENT_URL: kafka:9092
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID}
    depends_on:
      - mongo
      - kafka
    ports:
      - "8080:8080"

  # Local chat startup is intentionally deferred until the current Go Kafka
  # consumer stops requiring Aiven TLS/SASL values in non-production mode.
  # The production Dockerfile and CI/CD image build are still included.

volumes:
  mongo-data:
  redis-data:
